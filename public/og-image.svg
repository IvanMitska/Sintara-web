<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8E2DE2"/>
      <stop offset="100%" style="stop-color:#4A00E0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(142,45,226,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(142,45,226,0.1)" filter="url(#glow)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(74,0,224,0.1)" filter="url(#glow)"/>

  <!-- Logo icon -->
  <rect x="500" y="150" width="80" height="80" rx="16" fill="url(#accentGrad)"/>
  <text x="540" y="210" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">S</text>

  <!-- Company name -->
  <text x="600" y="200" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="white" text-anchor="middle">Sintara</text>

  <!-- Tagline -->
  <text x="600" y="320" font-family="Inter, Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)" text-anchor="middle">IT-студия веб-разработки</text>

  <!-- Services -->
  <text x="600" y="400" font-family="Inter, Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)" text-anchor="middle">Веб-сайты • Telegram боты • UI/UX дизайн</text>

  <!-- Tech stack -->
  <text x="600" y="480" font-family="Inter, Arial, sans-serif" font-size="20" fill="url(#accentGrad)" text-anchor="middle">React • TypeScript • Node.js • Three.js</text>

  <!-- URL -->
  <text x="600" y="560" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.8)" text-anchor="middle">sintara.io</text>

  <!-- Accent line -->
  <rect x="350" y="520" width="500" height="3" rx="2" fill="url(#accentGrad)" opacity="0.5"/>
</svg>
