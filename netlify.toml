[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # 22, not 18: scripts/prerender.mjs reads import.meta.dirname, which lands in
  # Node 20.11. On 18 it is undefined, resolve() throws, and the whole build
  # fails after vite has already succeeded — so the site keeps serving the
  # previous deploy and nothing looks broken until you check the URL.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Brief submissions. MUST stay above the SPA catch-all below — redirects are
# evaluated in order, and the catch-all would otherwise answer /api/* with
# index.html and the form would silently "succeed" against an HTML page.
#
# Which is exactly what happened for as long as public/_redirects existed:
# Netlify evaluates every rule from _redirects BEFORE the ones here, and that
# file held nothing but `/*  /index.html  200`. So this rule was unreachable,
# GET /api/brief returned the 72 KB homepage and POST returned 404 — the brief
# form could not submit at all. public/_redirects is gone now; the only
# _redirects that ships is generated into dist/ by scripts/qr-redirects.mjs and
# contains QR short links only. Do not put a catch-all back into it.
[[redirects]]
  from = "/api/brief"
  to = "/.netlify/functions/brief"
  status = 200

# The QR scan report. Not under /qr*, which is generated into dist/_redirects
# and routes everything starting with "qr" into the counting function — this
# page would be swallowed by it and filed as a scan of a code called "qr-stats".
# Access is a token checked inside the function; without QR_STATS_TOKEN set in
# the site environment it answers 404.
[[redirects]]
  from = "/api/qr-stats"
  to = "/.netlify/functions/qr-stats"
  status = 200

# Legacy case URLs. /project/<slug> predates /work/<slug> and still has inbound
# links. Without this they fall through to the SPA shell, which now means the
# prerendered HOMEPAGE — homepage content, homepage canonical — so any authority
# those links carry lands on the wrong page. A 301 passes it to the real case.
# The client route stays in App.tsx as a safety net for anything that reaches
# React without passing through the CDN.
[[redirects]]
  from = "/project/*"
  to = "/work/:splat"
  status = 301
  force = true

# SPA redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache optimization
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3D models — large GLBs, served once per session via the preloader path
# then reused by drei's useGLTF on the footer scene. Strong cache coalesces
# the preload fetch and drei's later request into a single network hit.
# Immutable, so a changed model must ship under a new filename (astronaut-v2).
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Env map + Draco decoder for the footer scene. Previously pulled from
# raw.githack.com and gstatic.com; self-hosted now, so give them the same
# strong cache as the models.
[[headers]]
  for = "/hdr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Project covers + screens — replaceable in place, so we don't want
# "immutable". must-revalidate makes the browser check ETag every day (or
# sooner on hard refresh), so a replaced cover.webp actually reaches users
# instead of being served from a stale heuristic cache. For an immediate
# bust of existing stale caches, bump ASSET_VERSION in src/lib/asset.ts.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Prevent indexing of development files
[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"

# SEO files - allow indexing
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=3600"

# Images for social sharing
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"