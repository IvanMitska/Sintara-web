[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# SPA redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache optimization
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3D models — large GLBs, served once per session via the preloader path
# then reused by drei's useGLTF on the footer scene. Strong cache coalesces
# the preload fetch and drei's later request into a single network hit.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Project covers + screens — replaceable in place, so we don't want
# "immutable". must-revalidate makes the browser check ETag every day (or
# sooner on hard refresh), so a replaced cover.webp actually reaches users
# instead of being served from a stale heuristic cache. For an immediate
# bust of existing stale caches, bump ASSET_VERSION in src/lib/asset.ts.
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Prevent indexing of development files
[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"

# SEO files - allow indexing
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=3600"

# Images for social sharing
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"