<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Sintara — Digital Product Studio</title>
    <meta name="title" content="Sintara — Digital Product Studio" />
    <meta name="description" content="Sintara is an independent digital product studio. We design and build websites, web apps and custom software — from first idea to launch." />
    <meta name="keywords" content="digital product studio, web development, web application development, custom software development, website development, web apps, product design, UI/UX design, SaaS development, CRM development, React, TypeScript, Node.js, Sintara, business automation" />
    <meta name="author" content="Sintara" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <link rel="canonical" href="https://sintara.io/" />

    <!--
      No hreflang alternates on purpose. They used to declare a Russian and an
      English version, both pointing at this same URL — which is not what
      hreflang means and is ignored (at best) by search engines. Language here
      is client-side state, so there is genuinely only one URL per page.

      To claim the bilingual audience properly, the languages need their own
      addresses (/en/... or en.sintara.io) with hreflang pairs pointing at each
      other. That's a routing change, not a head change.
    -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sintara.io/" />
    <meta property="og:title" content="Sintara — Digital Product Studio" />
    <meta property="og:description" content="Independent digital product studio. We design and build websites, web apps and custom software — from first idea to launch." />
    <meta property="og:image" content="https://sintara.io/og-image.png?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sintara — digital product studio" />
    <meta property="og:site_name" content="Sintara" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sintara.io/" />
    <meta name="twitter:title" content="Sintara — Digital Product Studio" />
    <meta name="twitter:description" content="Independent digital product studio — websites, web apps and custom software, from idea to launch." />
    <meta name="twitter:image" content="https://sintara.io/og-image.png?v=4" />
    <meta name="twitter:image:alt" content="Sintara — digital product studio" />

    <!-- Favicon & Icons (dark mark; ?v=2 busts the old cached favicons) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#08060f" />
    <!-- Tints the mobile browser chrome / iOS status-bar area. Set to the
         hero's dark fallback (#08060f) so the top of the page blends into our
         background instead of showing a white strip above the dark hero. -->
    <meta name="theme-color" content="#08060f" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Geo Tags for Local SEO -->
    <meta name="geo.region" content="TH-20" />
    <meta name="geo.placename" content="Chon Buri, Thailand" />
    <meta name="geo.country" content="TH" />

    <!-- Performance & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <!-- gtag.js is injected on idle by src/lib/analytics.ts; warming the
         connection here saves the DNS + TLS round-trips at that moment. -->
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />

    <!-- Typography: Schibsted Grotesk (single family) + JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the display typeface (PP Neue Montreal) up front so the
         browser doesn't lazily fetch a weight mid-navigation and flash the
         Schibsted Grotesk fallback (FOUT). All three weights are used across
         pages; loading them eagerly keeps them cached for every route. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PPNeueMontreal-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PPNeueMontreal-Semibold.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PPNeueMontreal-Extrabold.woff2" />

    <!-- Critical pre-JS styles. All real styles arrive with the bundle
         (styled-components GlobalStyles), so without this block the first
         paint uses UA defaults — body margin 8px, white background — and the
         whole page jumps 8px + flashes when the bundle lands. Mirror the
         layout-affecting essentials here so the pre-JS frame already matches.
         styled-components injects its <style> later in <head>, so GlobalStyles
         still wins once loaded. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: #08060f; overflow-y: scroll; }
      body {
        background: #08060f;
        font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont,
          'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      @media (pointer: coarse) {
        html { overflow-y: auto; }
      }
    </style>
